name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      # Same image tag as docker-compose.yml.
      postgres:
        image: postgres:15.13-alpine
        env:
          POSTGRES_USER: gatehouse
          POSTGRES_PASSWORD: gatehouse
          POSTGRES_DB: gatehouse
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U gatehouse"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://gatehouse:gatehouse@localhost:54329/gatehouse
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Re-measure and fail if any deterministic number differs from the committed results.
      - run: pnpm measure --check
      - run: pnpm --filter web build

  leak-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Fails the build if any word from a secret word list (FORBIDDEN, words joined
      # with |) appears in tracked files. Only file names and match counts are
      # printed, since GitHub masks the whole secret, not each word inside it.
      - name: Check against the word list
        env:
          FORBIDDEN: ${{ secrets.FORBIDDEN }}
        run: |
          if [ -z "$FORBIDDEN" ]; then echo "FORBIDDEN not set, skipping"; exit 0; fi
          if git grep -icE "$FORBIDDEN" -- . ':!.github'; then
            echo "Word from the list found"; exit 1
          fi
