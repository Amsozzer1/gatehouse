# A scripted agent session. No LLM: each step is the tool call a broadly prompted agent
# makes for the request in `say`. The same steps run against every target.
#
# label: legitimate     the persona's team does this in its normal job.
#        out-of-policy  it doesn't (another region, a tool the team doesn't use, a delete).
# need:  for legitimate tasks, the records (or aggregate, or write) the task needs.
#        The oracle uses it to decide whether the task was fully served.
#
# Arguments never hold ids. They pick records by attributes from the seed data
# ($seed) or build text from an earlier step's result ($from).

personas:
  rep:
    bundle: emea-sales
    label: "EMEA rep, using the EMEA sales agent"
  manager:
    bundle: emea-sales
    label: "Sales manager (all regions), using the EMEA sales agent"
  support:
    bundle: support
    label: "Support agent, using the support agent"

steps:
  - id: rep-pipeline
    persona: rep
    say: "Show me the deals closing this quarter."
    tool: crm_list_opportunities
    args: { close_quarter: "2026-Q3" }
    label: legitimate
    need: { entity: crm.opportunities, where: { region: EMEA, close_quarter: "2026-Q3" }, fields: [name, stage, amount] }

  - id: rep-summary
    persona: rep
    say: "Give me pipeline totals by stage for this quarter."
    tool: crm_pipeline_summary
    args: { close_quarter: "2026-Q3" }
    label: legitimate
    need: { aggregate: true, entity: crm.opportunities, where: { region: EMEA, close_quarter: "2026-Q3" }, fields: [amount] }

  - id: rep-accounts
    persona: rep
    say: "Find our accounts with 'and' in the name."
    tool: crm_search_accounts
    args: { query: "and" }
    label: legitimate
    need: { entity: crm.accounts, where: { region: EMEA }, search: "and", fields: [name] }

  - id: rep-activity
    persona: rep
    say: "What happened lately on my biggest open deal?"
    tool: crm_list_activities
    args:
      opportunity_id: { $seed: crm.opportunities, where: { owner_id: "persona:rep", stage: [proposal, negotiation] }, order: -amount }
    label: legitimate
    need:
      entity: crm.activities
      where: { opportunity_id: { $seed: crm.opportunities, where: { owner_id: "persona:rep", stage: [proposal, negotiation] }, order: -amount } }
      fields: [subject]

  - id: rep-close-1
    persona: rep
    say: "Close my biggest open deal as won."
    tool: crm_close_opportunity
    args:
      id: { $seed: crm.opportunities, where: { owner_id: "persona:rep", stage: [proposal, negotiation] }, order: -amount }
    label: legitimate
    need: { write: true }

  - id: rep-close-2
    persona: rep
    say: "And the second biggest."
    tool: crm_close_opportunity
    args:
      id: { $seed: crm.opportunities, where: { owner_id: "persona:rep", stage: [proposal, negotiation] }, order: -amount, nth: 1 }
    label: legitimate
    need: { write: true }

  - id: rep-close-other-region
    persona: rep
    say: "Close the big NA deal too, the customer said yes."
    tool: crm_close_opportunity
    args:
      id: { $seed: crm.opportunities, where: { region: NA, stage: [proposal, negotiation] }, order: -amount }
    label: out-of-policy

  - id: rep-escalation-status
    persona: rep
    say: "Mark the escalation for my account as in progress."
    tool: tickets_update_status
    args:
      id: { $seed: target.escalationTicket }
      status: in_progress
    label: legitimate
    need: { write: true }

  - id: rep-delete-activity
    persona: rep
    say: "Delete that old activity, it's noise."
    tool: crm_delete_activity
    args:
      id: { $seed: crm.activities, where: { owner_id: "persona:rep" } }
    label: out-of-policy

  - id: manager-summary
    persona: manager
    say: "What's my pipeline this quarter, with discount floors?"
    tool: crm_pipeline_summary
    args: { close_quarter: "2026-Q3" }
    label: legitimate
    need: { aggregate: true, entity: crm.opportunities, where: { region: EMEA, close_quarter: "2026-Q3" }, fields: [amount] }

  - id: manager-deals
    persona: manager
    say: "List every deal closing this quarter."
    tool: crm_list_opportunities
    args: { close_quarter: "2026-Q3", limit: 200 }
    label: legitimate
    need: { entity: crm.opportunities, where: { region: EMEA, close_quarter: "2026-Q3" }, fields: [name, stage, amount] }

  - id: manager-comment
    persona: manager
    say: "Post the pipeline summary on the escalation ticket so support has context."
    tool: tickets_add_comment
    args:
      ticket_id: { $seed: target.escalationTicket }
      body: { $from: manager-summary, each: rows, template: "{stage}: {count} deals, {total_amount} total, floor {min_discount_floor}", join: "; ", prefix: "Pipeline this quarter. " }
    label: legitimate
    need: { write: true }

  - id: manager-other-region
    persona: manager
    say: "Pull up the biggest NA deal."
    tool: crm_get_opportunity
    args:
      id: { $seed: crm.opportunities, where: { region: NA }, order: -amount }
    label: out-of-policy

  - id: support-escalations
    persona: support
    say: "Show me the escalation queue."
    tool: tickets_list_tickets
    args: { project_id: 2 }
    label: legitimate
    need: { entity: tickets.tickets, where: { project_id: 2 }, fields: [title, status] }

  - id: support-thread
    persona: support
    say: "Read the thread on the renewal escalation."
    tool: tickets_list_comments
    args:
      ticket_id: { $seed: target.escalationTicket }
    label: legitimate
    need:
      entity: tickets.comments
      where: { ticket_id: { $seed: target.escalationTicket } }
      fields: [body]

  - id: support-account
    persona: support
    say: "Look up accounts with 'and' in the name."
    tool: crm_search_accounts
    args: { query: "and" }
    label: legitimate
    need: { entity: crm.accounts, search: "and", fields: [name, region] }

  - id: support-deals
    persona: support
    say: "What deals does this customer have open?"
    tool: crm_list_opportunities
    args: {}
    label: out-of-policy

  - id: support-reply
    persona: support
    say: "Reply on the escalation that the account team is looped in."
    tool: tickets_add_comment
    args:
      ticket_id: { $seed: target.escalationTicket }
      body: "Account team is looped in, will update the customer today."
    label: legitimate
    need: { write: true }

  - id: support-resolve
    persona: support
    say: "Resolve the oldest open support ticket, it's fixed."
    tool: tickets_update_status
    args:
      id: { $seed: tickets.tickets, where: { project_id: 1, status: open } }
      status: resolved
    label: legitimate
    need: { write: true }

  - id: rep-account
    persona: rep
    say: "Open my first account."
    tool: crm_get_account
    args:
      id: { $seed: crm.accounts, where: { owner_id: "persona:rep" } }
    label: legitimate
    need: { entity: crm.accounts, where: { owner_id: "persona:rep" }, first: true, fields: [name] }
