services:
  postgres:
    image: postgres:15.13-alpine
    environment:
      POSTGRES_USER: gatehouse
      POSTGRES_PASSWORD: gatehouse
      POSTGRES_DB: gatehouse
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatehouse"]
      interval: 2s
      timeout: 2s
      retries: 30
